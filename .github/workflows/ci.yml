name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator:
    name: Orchestrator (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: policies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/policies_test?sslmode=disable

    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

  issuing-service:
    name: Issuing service (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: issuing-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: issuing-service/global.json

      - name: Restore
        run: dotnet restore IssuingService.slnx

      - name: Build (analyzers, warnings as errors)
        run: dotnet build IssuingService.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test IssuingService.slnx --configuration Release --no-build
