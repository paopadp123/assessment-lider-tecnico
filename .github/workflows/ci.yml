name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator:
    name: Orchestrator (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: policies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4
        env:
          RABBITMQ_DEFAULT_USER: app
          RABBITMQ_DEFAULT_PASS: app
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/policies_test?sslmode=disable
      TEST_RABBITMQ_URL: amqp://app:app@localhost:5672/

    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 -timeout 5m ./...

  issuing-service:
    name: Issuing service (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: issuing-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: issuing-service/global.json

      - name: Restore
        run: dotnet restore IssuingService.slnx

      - name: Build (analyzers, warnings as errors)
        run: dotnet build IssuingService.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test IssuingService.slnx --configuration Release --no-build

  simulator:
    name: Simulator (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End to end (docker compose)
    runs-on: ubuntu-latest
    needs: [orchestrator, issuing-service, simulator]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Create .env with random secrets
        run: bash scripts/dev-env.sh

      - name: Start the system
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run the 4 scenarios
        run: bash scripts/e2e/run-all.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
